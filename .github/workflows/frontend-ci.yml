name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/dashboard/package.json

      - name: Install dependencies
        working-directory: frontend/dashboard
        run: npm install

      - name: Build
        working-directory: frontend/dashboard
        run: npm run build

      - name: Confirm build output
        working-directory: frontend/dashboard
        run: |
          echo "Build complete"
          ls dist/